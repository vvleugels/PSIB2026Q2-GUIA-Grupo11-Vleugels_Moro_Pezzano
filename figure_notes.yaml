m4_quality_vs_ratio: |
  Compression ratio versus reconstruction quality for the full frame, eye crop,
  masked crop and pupil mask. Higher PSNR and SSIM indicate closer agreement with
  the source; farther right means fewer encoded bytes relative to raw array bytes,
  including file headers. Circles are primary-frame results and triangles secondary.
  Lossless PSNR is infinite and omitted from the top row; lossless SSIM is 1.
  Black backgrounds can dominate whole-image scores, so inspect edge enlargements too.

m4_temporal_diameter: |
  Full-video pupil tracking repeated with an uncompressed baseline and JPEG inputs.
  The top panel compares smoothed equivalent diameters in pixels over time.
  The lower panel shows raw diameter differences from baseline only where both
  runs accepted the same frame; values near zero indicate agreement. Compare
  response shape and divergence together with acceptance rates in the saved tables.
  Agreement measures compression effects, rather than anatomical accuracy.
